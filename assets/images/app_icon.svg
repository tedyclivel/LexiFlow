<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="20" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="226" ry="226" fill="url(#bgGradient)"/>
  
  <!-- Inner glow effect -->
  <rect x="50" y="50" width="924" height="924" rx="200" ry="200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- LEXI Text -->
  <text x="512" y="600" font-family="Arial, sans-serif" font-size="280" font-weight="900" 
        text-anchor="middle" fill="url(#textGradient)" filter="url(#shadow)" 
        letter-spacing="-15">LEXI</text>
  
  <!-- Decorative dots -->
  <circle cx="780" cy="320" r="35" fill="#FF9500" opacity="0.8"/>
  <circle cx="850" cy="420" r="28" fill="#A855F7" opacity="0.7"/>
  <circle cx="200" cy="750" r="32" fill="#00E5FF" opacity="0.6"/>
</svg>
